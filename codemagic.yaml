workflows:
  sugarloopfair-app-store:
    name: Sugarloop Fair Signed IPA
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        provisioning_profiles:
          - sugarloopfair_push_v2
        certificates:
          - sugarloopfair
      vars:
        XCODE_PROJECT: SugarloopFair.xcodeproj
        XCODE_SCHEME: SugarloopFair
      xcode: 27.1
    scripts:
      - name: Unpack iOS source archive
        script: |
          mkdir -p "$CM_BUILD_DIR/ios_src"
          tar -xzf "$CM_BUILD_DIR/sugarloopfair-source.tar.gz" -C "$CM_BUILD_DIR/ios_src"
      - name: Apply App Store signing profiles
        script: |
          cd "$CM_BUILD_DIR/ios_src"
          xcode-project use-profiles
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/ios_src/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
      - name: Verify IPA was exported
        script: |
          test -s "$CM_BUILD_DIR/build/ios/ipa/SugarloopFair.ipa"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
